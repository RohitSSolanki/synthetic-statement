name: Deploy site to GitHub Pages

# The hosted Pyodide demo lives in site/. GitHub Pages "deploy from a branch"
# only allows the / or /docs folder, so publishing an arbitrary directory
# (site/) requires the GitHub Actions source instead. Set Settings -> Pages ->
# Source to "GitHub Actions" for this workflow to take effect.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
